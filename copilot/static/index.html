<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172825">
  <meta name="description" content="A local knowledge workspace for your files, conversations, and project memory.">
  <title>LocalMind · Knowledge Copilot</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-2 2V11.5a9.5 9.5 0 0 1 19 0Z"/><path d="M7 10h10M7 14h6"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M3 5h4v16H3zM10 3h4v18h-4zM17 6l4-1 3 15-4 1z"/></symbol>
    <symbol id="i-memory" viewBox="0 0 24 24"><path d="M9 3a3 3 0 0 0-3 3 4 4 0 0 0-3 6 4 4 0 0 0 3 6 3 3 0 0 0 6 2V5a3 3 0 0 0-3-2ZM15 3a3 3 0 0 1 3 3 4 4 0 0 1 3 6 4 4 0 0 1-3 6 3 3 0 0 1-6 2"/><path d="M6 6v3h3M6 18v-3h3M18 6v3h-3M18 18v-3h-3"/></symbol>
    <symbol id="i-project" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M8 6V3h8v5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1 1 3-2 2 2 2-1 3 3 1 1 3h6l1-3 3-1-1-3 2-2-2-2 1-3-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H5v18h14V8ZM14 3v5h5M8 12h8M8 16h6"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 0 0-14-3L3 8m0-5v5h5M4 16a8 8 0 0 0 14 3l3-3m0 5v-5h-5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 15v6h16v-6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L21 7a2 2 0 0 0-4-4L5 15ZM4 20l1-5 4 4"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 3 6 6 3-6 3-3 6-3-6-6-3 6-3Z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m9 15 6-6M8 17l-1 1a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0m0 10a4 4 0 0 0 6 0l5-5a4 4 0 0 0-6-6l-1 1"/></symbol>
  </defs></svg>
  <div class="app-shell">
    <button class="sidebar-scrim" id="sidebar-scrim" aria-label="Close navigation" hidden></button>
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#chat" aria-label="LocalMind home"><span class="brand-mark"><span></span><span></span><span></span></span><span>localmind<span class="brand-caption">YOUR KNOWLEDGE, AT HOME</span></span></a>
      <button class="new-chat" id="new-chat"><svg class="icon"><use href="#i-plus"/></svg>New conversation<span class="shortcut">↵</span></button>
      <nav class="nav-list">
        <button class="nav-item active" data-view="chat"><svg class="icon"><use href="#i-chat"/></svg>Copilot<span class="nav-dot"></span></button>
        <button class="nav-item" data-view="library"><svg class="icon"><use href="#i-library"/></svg>Library<span class="nav-count" id="library-count">0</span></button>
        <button class="nav-item" data-view="memory"><svg class="icon"><use href="#i-memory"/></svg>Memory<span class="nav-count" id="memory-count">0</span></button>
        <button class="nav-item" data-view="projects"><svg class="icon"><use href="#i-project"/></svg>Projects<span class="nav-count" id="projects-count">0</span></button>
      </nav>
      <div class="sidebar-divider"></div>
      <div class="recents-heading">RECENT CONVERSATIONS</div>
      <div class="recent-list" id="recent-list"><p class="sidebar-empty">Your conversations will live here.</p></div>
      <div class="sidebar-bottom">
        <button class="nav-item" data-view="settings"><svg class="icon"><use href="#i-settings"/></svg>Settings</button>
        <div class="local-note"><span class="local-note-icon"><svg class="icon"><use href="#i-shield"/></svg></span><span>On your device<span>Private by design</span></span><span class="privacy-dot"></span></div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left"><button class="icon-button mobile-menu" id="mobile-menu" aria-label="Open navigation"><svg class="icon"><use href="#i-menu"/></svg></button><span class="workspace-label">Personal workspace</span><span class="breadcrumb-slash">/</span><span id="view-title">Copilot</span></div>
        <button class="runtime-pill" id="runtime-pill" title="View local model settings"><span class="status-dot"></span><span id="runtime-label">Connecting locally…</span><svg class="icon"><use href="#i-chevron"/></svg></button>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="false"></div>
  <div class="modal-layer" id="modal-layer" hidden></div>
</body>
</html>
