[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-knowledge-copilot"
version = "0.1.0"
description = "LocalMind Windows edition: local knowledge, agentic retrieval and MCP project memory"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "mcp>=1.20,<2",
  "pypdf>=6,<7",
  "numpy>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
copilot = "copilot.__main__:main"
copilot-memory = "copilot.mcp_server:main"

[tool.setuptools.packages.find]
include = ["copilot*"]

[tool.setuptools.package-data]
copilot = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
