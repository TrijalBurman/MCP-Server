name: local-knowledge-copilot

services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_models:/root/.ollama]
    environment: [OLLAMA_KEEP_ALIVE=24h]
    gpus: all
  ollama-init:
    image: ollama/ollama:latest
    volumes: [ollama_models:/root/.ollama]
    depends_on: [ollama]
    entrypoint: ["/bin/sh", "-c", "sleep 5 && ollama pull qwen2.5:7b"]
  mcp:
    build: ./mcp_server
    ports: ["8000:8000"]
    environment: [DATA_DIR=/app/data]
    volumes:
      - ./data:/app/data
      - chroma_cache:/root/.cache/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
  agent:
    build: ./agent
    ports: ["8001:8001"]
    environment:
      MCP_URL: http://mcp:8000
      OLLAMA_URL: http://ollama:11434
    depends_on: [mcp, ollama]
  frontend:
    build: ./frontend
    ports: ["8501:8501"]
    environment: [AGENT_URL=http://agent:8001, MCP_URL=http://mcp:8000]
    volumes: [./data:/app/data]
    depends_on: [agent, mcp]
volumes:
  ollama_models:
  chroma_cache:
